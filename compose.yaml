services:
  studio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - studio-data:/app/data
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  studio-data:
